name: check-prices

on:
  schedule: [{ cron: '17 */4 * * *' }]
  push: { branches: [main], paths: ['data/products.json'] }
  workflow_dispatch:

concurrency: { group: prices, cancel-in-progress: false }

permissions: { contents: write, issues: write }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: browser
        run: >-
          node -e "const fs = require('fs'); const f = 'data/products.json';
          const needed = fs.existsSync(f) && JSON.parse(fs.readFileSync(f, 'utf8')).products.some((p) => p.useBrowser && !p.bought);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'needed=' + needed + '\n')"
      - if: steps.browser.outputs.needed == 'true'
        run: pnpm --filter @prysuil/scraper exec playwright install --with-deps chromium
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: pnpm --filter @prysuil/scraper check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
